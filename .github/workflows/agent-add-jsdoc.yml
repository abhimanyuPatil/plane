name: AI Agent – Add JSDoc to attachment.ts

# This workflow demonstrates invoking a coding agent (Claude) with a fixed
# prompt. It runs on manual dispatch so you can trigger it at any time from
# the GitHub Actions tab without needing a PR or push event.
on:
  workflow_dispatch:

jobs:
  add-jsdoc:
    name: Add missing JSDoc comments via Claude
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # contents/pull-requests: write so Claude can push a branch and open a PR.
    # id-token: write is required by the Claude GitHub App's OIDC exchange —
    # the action authenticates as the App (not via a raw API key) when
    # github_token is omitted, and the OIDC handshake needs this permission.
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      # 1. Check out the full repo so the agent can read surrounding files
      #    and use them as context when writing the JSDoc.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up the Node.js toolchain that matches the project's .node-version
      #    file. The agent can run `pnpm check:types` to verify its changes
      #    compile cleanly before committing.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: $(pnpm store path --silent)
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 3. Hand control to the Claude coding agent.
      #    The prompt is fixed — it never changes between runs — which is the
      #    core point of this exercise. The agent reads the target file,
      #    consults neighbouring files for the JSDoc style, writes the docs,
      #    runs a type check to validate nothing broke, then opens a PR.
      #
      #    Authentication: github_token is intentionally omitted so the action
      #    authenticates as the Claude GitHub App (installed on this repo).
      #    The App has Contents + Pull Requests read/write and is the
      #    recommended auth path over a raw GITHUB_TOKEN.
      #    anthropic_api_key is still needed to call the Claude API for
      #    inference; the GitHub App only covers the git/PR operations.
      - name: Run Claude coding agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # ── FIXED PROMPT ──────────────────────────────────────────────────
          # The agent is given a concrete, scoped task with clear style rules
          # so the output is deterministic and reviewable.
          prompt: |
            Your task is to add JSDoc comments to every exported function in
            `packages/utils/src/attachment.ts`. That file currently has four
            exported functions with no documentation at all.

            Style guide — follow the pattern already used in these files:
              - packages/utils/src/datetime.ts   (most complete example)
              - packages/utils/src/array.ts
              - packages/utils/src/color.ts

            Rules:
            1. Use /** … */ block comments placed directly above each export.
            2. Always include:
               - @description  — one-sentence explanation of what the function does
               - @param        — one tag per parameter, with the TypeScript type in
                                 braces and a short description
               - @returns      — the return type in braces and what it represents
               - @example      — a realistic usage snippet (see datetime.ts)
            3. Do NOT touch any implementation code — only add comments.
            4. Do NOT document unexported internal helpers.
            5. Keep the copyright header at the top of the file untouched.

            After editing the file:
            - Run `pnpm turbo run check:types --filter=@plane/utils` to confirm
              the file still compiles with no errors.
            - If there are errors, fix them (documentation-only changes should
              never cause type errors, so something unexpected happened — read
              the error carefully).

            Finally, create a pull request:
              title:  docs(utils): add JSDoc comments to attachment.ts
              branch: agent/jsdoc-attachment-utils
              base:   preview
              body:   |
                ## What
                Adds `@description`, `@param`, `@returns`, and `@example` JSDoc
                blocks to the four exported functions in `packages/utils/src/attachment.ts`.

                ## Why
                All sibling files in `packages/utils/src/` have JSDoc on their
                exports; `attachment.ts` was the only exception.

                ## How
                Generated by the `AI Agent – Add JSDoc to attachment.ts`
                GitHub Actions workflow using Claude.
          # ── END OF FIXED PROMPT ───────────────────────────────────────────
