# .github/workflows/anthropic-wif-test.yml
name: anthropic-wif-test
on: push
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Decode JWT claims (debug)
        run: |
          echo "=== JWT Claims ==="
          echo "$JWT" | cut -d. -f2 | base64 -d 2>/dev/null | jq .
      - name: Exchange for an Anthropic access token
        run: |
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_01HrV32N8GqunuJLSmt4uo73",
            "organization_id": "ac7987d2-7eb8-4697-8a85-8514588f8f95",
            "service_account_id": "svac_01FiCY1hiCSAEiSuCCyf8cDu",
            "workspace_id": "wrkspc_018fauSWDk3qfKRGdhUjnyHZ"
          }
          JSON